server {
    listen 80;
    server_name localhost ide.lujandecuyo.gob.ar;

    # Compresión gzip para alto rendimiento en mapas y GeoJSON
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/geo+json;
    gzip_min_length 1024;

    # Geoportal y Visor Cartográfico (Frontend estático)
    location / {
        root /usr/share/nginx/html;
        index index.html visor.html;
        try_files $uri $uri/ /index.html;

        # Cabeceras de seguridad y CORS abierto conforme a IDERA
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
    }

    # Proxy a GeoServer (WMS, WFS, WCS, WMTS)
    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Soporte CORS para consumo directo en QGIS / ArcGIS
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers '*';
    }

    # Proxy a pycsw (Catálogo de Metadatos CSW 2.0.2)
    location /csw {
        proxy_pass http://pycsw:8000/csw;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Access-Control-Allow-Origin *;
    }
}
