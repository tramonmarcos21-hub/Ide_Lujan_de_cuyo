version: '3.8'

services:
  # Base de Datos Espacial PostgreSQL 16 + PostGIS 3.4
  postgis:
    image: postgis/postgis:16-3.4
    container_name: ide_lujan_postgis
    environment:
      POSTGRES_DB: ide_lujan_db
      POSTGRES_USER: ide_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-LujanIDE2026_Secure}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ide_admin -d ide_lujan_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ide_network

  # Servidor de Mapas GeoServer 2.24+ con GeoWebCache y extensiones OGC
  geoserver:
    image: kartoza/geoserver:2.24.1
    container_name: ide_lujan_geoserver
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_PASSWORD:-LujanGeoServer2026!}
      GEOSERVER_DATA_DIR: /opt/geoserver/data_dir
      GEOWEBCACHE_CACHE_DIR: /opt/geoserver/data_dir/gwc
      INITIAL_MEMORY: "2G"
      MAXIMUM_MEMORY: "4G"
      ENABLE_JSONP: "true"
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
      PROXY_BASE_URL: "https://ide.lujandecuyo.gob.ar/geoserver"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      - ./geoserver/workspaces:/opt/geoserver/data_dir/workspaces/ide_lujan_templates:ro
      - ./geoserver/styles:/opt/geoserver/data_dir/styles_idera:ro
    ports:
      - "8082:8080"
    restart: unless-stopped
    networks:
      - ide_network

  # Catálogo de Metadatos CSW 2.0.2 / OGC API Records (pycsw) compatible IDERA
  pycsw:
    image: geopython/pycsw:latest
    container_name: ide_lujan_pycsw
    volumes:
      - ./pycsw/pycsw.cfg:/etc/pycsw/pycsw.cfg:ro
      - ./pycsw/records:/etc/pycsw/records:ro
      - pycsw_data:/var/lib/pycsw
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - ide_network

  # Gateway y Servidor Web Frontend (Nginx)
  nginx:
    image: nginx:alpine
    container_name: ide_lujan_gateway
    depends_on:
      - geoserver
      - pycsw
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - ide_network

networks:
  ide_network:
    name: ide_lujan_net
    driver: bridge

volumes:
  postgis_data:
    name: ide_lujan_postgis_data
  geoserver_data:
    name: ide_lujan_geoserver_data
  pycsw_data:
    name: ide_lujan_pycsw_data
